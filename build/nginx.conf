# ---------------------------------------------------------------------------
# App Template — nginx front door (baked into the UI image, see build/Dockerfile.ui).
#
# One container serves BOTH single-page apps and reverse-proxies BOTH APIs:
#
#   /MYAPP/            -> main SPA          (/usr/share/nginx/html/main)
#   /MYAPP/login/      -> login SPA         (/usr/share/nginx/html/login)
#   /MYAPP/api-auth/   -> apptemplate-auth-service:8080
#   /MYAPP/api-main/   -> apptemplate-api-service:8080
#
# ---------------------------------------------------------------------------
# THE `MYAPP` PLACEHOLDER
# ---------------------------------------------------------------------------
# `MYAPP` is the base path your app is mounted under. It exists because these
# apps are often deployed behind a shared hostname, one path per app
# (https://apps.example.com/my-app/...). It is NOT an nginx variable — it is a
# literal string you search-and-replace.
#
# To adopt a base path, replace every literal `MYAPP` in this file with your
# own segment (lowercase, no slashes), e.g. `MYAPP` -> `my-app`. It appears in:
#   * 5 `location` blocks (2 static, 3 proxied)
#   * 4 `proxy_cookie_path` directives (1 server-level default + 3 per-proxy)
# Then set the matching values elsewhere:
#   * deploy/helm/app-template/values*.yaml -> `pathPrefix`
#   * the frontend's runtime config (`<meta name="app:*">` tags)
#
# To serve the app at the ROOT of its own hostname instead, delete the `/MYAPP`
# prefix everywhere (locations become `/login/`, `/api-auth/`, `/api-main/`,
# `/`) and set `proxy_cookie_path / /;`. Also set `hostingMode: host` in the
# Helm values.
# ---------------------------------------------------------------------------

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream auth_backend {
    server apptemplate-auth-service:8080;
}

upstream api_backend {
    server apptemplate-api-service:8080;
}

server {
    listen 80;
    server_name localhost;

    # Cookies issued by the APIs are scoped to the app's base path.
    proxy_cookie_path / /;

    # Security headers.
    #
    # Third-party origins here are exactly the services this template ships
    # with. Drop the ones you do not use; add your own rather than loosening
    # `default-src`.
    #   cdn.onesignal.com / *.onesignal.com  -> web push (OneSignal)
    #   *.sentry.io                          -> error + performance reporting
    #   fonts.googleapis.com / fonts.gstatic.com -> web fonts loaded by index.html
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer-when-downgrade always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.onesignal.com; worker-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://onesignal.com https://*.onesignal.com https://*.sentry.io; manifest-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Custom maintenance page when upstream services are unavailable.
    error_page 502 503 504 /maintenance.html;

    # NOTE: nginx `add_header` does NOT merge across levels — a location that
    # declares any `add_header` drops every header inherited from the server
    # block. That is why the security headers are repeated here. Keep the two
    # lists in sync, and avoid adding `add_header` to the other locations.
    location = /maintenance.html {
        root /usr/share/nginx/html;
        internal;
        add_header Cache-Control "no-store" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer-when-downgrade always;
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'none';" always;
    }

    # Auth API proxy.
    location /MYAPP/api-auth/ {
        proxy_pass http://auth_backend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_cookie_path / /MYAPP/;
    }

    # TickerQ dashboard and the notification hub need WebSocket-friendly
    # settings, so they get their own block ahead of the generic API proxy.
    location /MYAPP/api-main/tickerq/ {
        proxy_pass http://api_backend/tickerq/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
        proxy_buffering off;

        proxy_cookie_path / /MYAPP/;
    }

    # Main API proxy.
    location /MYAPP/api-main/ {
        proxy_pass http://api_backend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_cookie_path / /MYAPP/;
    }

    # Login (auth) SPA. Client-side routing falls back to its index.html.
    location /MYAPP/login/ {
        alias /usr/share/nginx/html/login/;
        try_files $uri $uri/ /MYAPP/login/index.html;
    }

    # Main SPA. Client-side routing falls back to its index.html.
    location /MYAPP/ {
        alias /usr/share/nginx/html/main/;
        try_files $uri $uri/ /MYAPP/index.html;
    }

    # Convenience root, so the image is also usable without a base path.
    location / {
        root /usr/share/nginx/html/main;
        try_files $uri $uri/ /index.html;
    }
}
