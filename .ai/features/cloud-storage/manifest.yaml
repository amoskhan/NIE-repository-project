name: cloud-storage
title: Cloud Storage (Local + S3)
category: backend
status: released
description: >
  Pluggable file storage behind IFileStorageService, with a local-disk implementation
  (FileStorageService) and a real AWS S3 implementation (S3FileStorageService, AWSSDK.S3).
  Selected at startup via FileStorage:Provider; S3 credentials come from the AWS default
  credential chain (no keys in appsettings).
