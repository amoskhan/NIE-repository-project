name: authentication
title: Authentication
category: security
status: released
description: "Self-contained local identity provider: credentials in the UserAccounts table hashed with PasswordHasher, self-service registration, password reset and change, lockout, and Development-only demo accounts. Ships an optional external OIDC slot (Google/Microsoft/GitHub) that is disabled and empty. Both paths issue the same Valkey session the Main API validates."
