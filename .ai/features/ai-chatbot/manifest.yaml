name: ai-chatbot
title: AI Chatbot
category: backend
status: scaffolded
description: >
  AI-powered chat with SSE streaming, conversation management, and pgvector
  semantic search. Azure OpenAI is the only LLM backend shipped; without
  credentials ChatService uses a placeholder responder. Requires swapping the
  PostgreSQL image to pgvector/pgvector:pg18. Adopt only if the project
  surfaces a chat experience.
copierFlag: include_chat
relatedTasks: []
dependsOn: ["shared-utilities"]
removableInDerivedRepo: true
removalTaskId: null
