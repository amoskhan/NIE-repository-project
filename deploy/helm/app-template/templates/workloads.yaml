{{/*
One Deployment (or Argo Rollout) + Service per entry in .Values.workloads.

Argo Rollouts is OPTIONAL. A workload only renders as a Rollout when BOTH
.Values.rollouts.enabled is true AND the workload asks for strategy: BlueGreen.
With rollouts disabled (the default) everything is a plain Deployment, so the
chart installs on any vanilla cluster with no extra CRDs.

Every pod label set and every selector comes from the single
`app-template.selectorLabels` helper — name + instance + component. The
`instance` part is what keeps dev and prd from selecting each other's pods when
both are installed into the same namespace; do not drop it from one side only.
*/}}
{{- range $name, $workload := .Values.workloads }}
{{- $serviceName := include "app-template.serviceName" (list $ $name) }}
{{- $selectorLabels := include "app-template.selectorLabels" (list $ $name) }}
{{- $isBlueGreen := and $.Values.rollouts.enabled (eq $workload.strategy "BlueGreen") }}
{{- if $isBlueGreen }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $serviceName }}-active
  labels:
    {{- $selectorLabels | nindent 4 }}
spec:
  selector:
    {{- $selectorLabels | nindent 4 }}
  ports:
    - name: http
      port: {{ $workload.servicePort }}
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $serviceName }}-preview
  labels:
    {{- $selectorLabels | nindent 4 }}
spec:
  selector:
    {{- $selectorLabels | nindent 4 }}
  ports:
    - name: http
      port: {{ $workload.servicePort }}
      targetPort: http
---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ $serviceName }}
  labels:
    {{- $selectorLabels | nindent 4 }}
spec:
  replicas: {{ $workload.replicas }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- $selectorLabels | nindent 6 }}
  template:
    metadata:
      labels:
        {{- $selectorLabels | nindent 8 }}
    spec:
      {{- with $workload.serviceAccountName }}
      serviceAccountName: {{ . }}
      {{- end }}
      {{- with $workload.nodePool }}
      nodeSelector:
        pool: {{ . }}
      {{- end }}
      containers:
        - name: {{ $name }}
          image: "{{ $workload.image.repository }}:{{ $workload.image.tag }}"
          imagePullPolicy: {{ default "IfNotPresent" $workload.image.pullPolicy }}
          ports:
            - containerPort: {{ $workload.containerPort }}
              name: http
          envFrom:
            - secretRef:
                name: {{ $.Values.runtimeSecretName }}
          {{- with $workload.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          readinessProbe:
            httpGet:
              path: {{ $workload.healthPath }}
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: {{ $workload.healthPath }}
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
  strategy:
    blueGreen:
      activeService: {{ $serviceName }}-active
      previewService: {{ $serviceName }}-preview
      autoPromotionEnabled: true
---
{{- else }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $serviceName }}
  labels:
    {{- $selectorLabels | nindent 4 }}
spec:
  replicas: {{ $workload.replicas }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- $selectorLabels | nindent 6 }}
  template:
    metadata:
      labels:
        {{- $selectorLabels | nindent 8 }}
    spec:
      {{- with $workload.serviceAccountName }}
      serviceAccountName: {{ . }}
      {{- end }}
      {{- with $workload.nodePool }}
      nodeSelector:
        pool: {{ . }}
      {{- end }}
      containers:
        - name: {{ $name }}
          image: "{{ $workload.image.repository }}:{{ $workload.image.tag }}"
          imagePullPolicy: {{ default "IfNotPresent" $workload.image.pullPolicy }}
          ports:
            - containerPort: {{ $workload.containerPort }}
              name: http
          envFrom:
            - secretRef:
                name: {{ $.Values.runtimeSecretName }}
          {{- with $workload.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          readinessProbe:
            httpGet:
              path: {{ $workload.healthPath }}
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: {{ $workload.healthPath }}
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $serviceName }}
  labels:
    {{- $selectorLabels | nindent 4 }}
spec:
  selector:
    {{- $selectorLabels | nindent 4 }}
  ports:
    - name: http
      port: {{ $workload.servicePort }}
      targetPort: http
---
{{- end }}
{{- end }}
